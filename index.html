<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sach Aapke Desh News</title><meta name="description" content="सच की आवाज़, आपके साथ"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#111827}header{background:#9f1239;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto}.brand{font-size:24px;font-weight:800}.tag{font-size:13px;margin-top:3px;opacity:.9}nav{display:flex;gap:8px;overflow:auto;margin-top:13px}nav button{border:1px solid #fff6;background:#fff2;color:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap}main{padding:22px 14px}.hero,.card,article{background:#fff;border-radius:17px;box-shadow:0 3px 16px #0001}.hero{padding:22px;margin-bottom:18px}.hero h1,article h1{line-height:1.12}.hero h1{font-size:clamp(27px,5vw,42px)}.kicker{color:#9f1239;font-weight:700;font-size:13px}.meta{color:#64748b;font-size:13px}.summary{line-height:1.6;color:#334155}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{overflow:hidden}.cardbody{padding:16px}.card img,.hero img,article img{width:100%;max-height:520px;object-fit:cover}.card img{height:180px}.card h2{font-size:19px}.read{color:#9f1239;font-weight:700;cursor:pointer}.notice{text-align:center;padding:30px;color:#64748b}article{padding:22px}article .body{font-size:18px;line-height:1.8;white-space:pre-wrap}.back{padding:9px 13px;border:0;border-radius:9px;margin-bottom:12px}footer{background:#111827;color:#cbd5e1;text-align:center;padding:24px 14px;font-size:13px}
</style></head><body><header><div class="wrap"><div class="brand">SACH AAPKE DESH NEWS</div><div class="tag">सच की आवाज़, आपके साथ</div><nav id="cats"></nav></div></header><main class="wrap" id="app"><div class="notice">समाचार लोड हो रहे हैं…</div></main><footer>© Sach Aapke Desh News · New Delhi, India</footer>
<script>
let all=[],active="";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const image=u=>u?'<img src="'+esc(u)+'" loading="lazy" alt="">':"";
function card(x){return '<div class="card">'+image(x.image_url)+'<div class="cardbody"><div class="kicker">'+esc(x.category_name||"समाचार")+'</div><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary||"")+'</p><div class="read" onclick="openArticle(''+x.id+'')">पूरी खबर →</div></div></div>'}
function home(cat=""){active=cat;let a=all.filter(x=>!cat||x.category_name===cat);if(!a.length){app.innerHTML='<div class="hero notice">अभी प्रकाशित समाचार उपलब्ध नहीं हैं।</div>';return}let f=a[0];app.innerHTML='<section class="hero">'+image(f.image_url)+'<div class="kicker">'+esc(f.category_name||"समाचार")+'</div><h1>'+esc(f.title)+'</h1><div class="meta">'+new Date(f.published_at||f.created_at).toLocaleDateString("hi-IN")+' · '+esc(f.source||"")+'</div><p class="summary">'+esc(f.summary||"")+'</p><div class="read" onclick="openArticle(''+f.id+'')">पूरी खबर पढ़ें →</div></section><section class="grid">'+a.slice(1).map(card).join("")+'</section>'}
function openArticle(id){let x=all.find(a=>a.id===id);if(!x)return;app.innerHTML='<article><button class="back" onclick="home(active)">← वापस</button>'+image(x.image_url)+'<div class="kicker">'+esc(x.category_name||"समाचार")+'</div><h1>'+esc(x.title)+'</h1><div class="meta">'+new Date(x.published_at||x.created_at).toLocaleString("hi-IN")+' · '+esc(x.source||"")+'</div><p class="summary">'+esc(x.summary||"")+'</p><div class="body">'+esc(x.body||x.content||"")+'</div>'+(x.source_url?'<p><b>स्रोत:</b> <a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">मूल स्रोत</a></p>':"")+(x.photo_credit?'<p class="meta">Photo credit: '+esc(x.photo_credit)+'</p>':"")+'</article>';scrollTo(0,0)}
async function load(){try{let r=await fetch("/api/articles");if(!r.ok)throw 0;all=await r.json();let n=[...new Set(all.map(x=>x.category_name).filter(Boolean))];cats.innerHTML='<button onclick="home()">सभी</button>'+n.map(x=>'<button onclick="home(''+x.replaceAll("'","\'")+'')">'+esc(x)+'</button>').join("");home()}catch(e){app.innerHTML='<div class="hero notice">समाचार लोड नहीं हो सके। कृपया बाद में फिर प्रयास करें।</div>'}}load();
</script></body></html>
